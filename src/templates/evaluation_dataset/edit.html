{% extends "base.html" %}

{% block title %}Edit Evaluation Case{% endblock %}

{% block content %}
<div class="content-container">
    <h1 class="page-title">Edit Evaluation Case</h1>
    <p class="page-subtitle">Update video comparison case for evaluation</p>

    <form method="POST" action="{{ url_for('projects.update_evaluation_case', record_id=record.id) }}" class="form-card">
        <div class="form-group">
            <label for="user_background" class="form-label">User Background</label>
            <input type="text" class="form-control" id="user_background" name="user_background" value="{{ record.user_background or '' }}" required>
        </div>

        <div class="form-group">
            <label for="first_video_summary" class="form-label">First Video Summary</label>
            <textarea class="form-control" id="first_video_summary" name="first_video_summary" rows="3" required>{{ record.first_video_summary or '' }}</textarea>
        </div>

        <div class="form-group">
            <label for="first_video_url" class="form-label">First Video URL</label>
            <input type="url" class="form-control" id="first_video_url" name="first_video_url" value="{{ record.first_video_url or '' }}">
        </div>

        <div class="form-group">
            <label for="first_video_author" class="form-label">First Video Author</label>
            <input type="text" class="form-control" id="first_video_author" name="first_video_author" value="{{ record.first_video_author or '' }}">
        </div>

        <div class="form-group">
            <label for="second_video_summary" class="form-label">Second Video Summary</label>
            <textarea class="form-control" id="second_video_summary" name="second_video_summary" rows="3" required>{{ record.second_video_summary or '' }}</textarea>
        </div>

        <div class="form-group">
            <label for="second_video_url" class="form-label">Second Video URL</label>
            <input type="url" class="form-control" id="second_video_url" name="second_video_url" value="{{ record.second_video_url or '' }}">
        </div>

        <div class="form-group">
            <label for="second_video_author" class="form-label">Second Video Author</label>
            <input type="text" class="form-control" id="second_video_author" name="second_video_author" value="{{ record.second_video_author or '' }}">
        </div>

        <div class="form-group">
            <label for="expected_output" class="form-label">Expected Output <small class="text-muted">(JSON format)</small></label>
            <textarea class="form-control" id="expected_output" name="expected_output" rows="4" required>{{ expected_output_json }}</textarea>
        </div>

        <div class="form-group">
            <label for="selected_video" class="form-label">Selected Video</label>
            <select class="form-control" id="selected_video" name="selected_video" required>
                <option value="">Select...</option>
                <option value="first_video" {% if record.selected_video == 'first_video' %}selected{% endif %}>First Video</option>
                <option value="second_video" {% if record.selected_video == 'second_video' %}selected{% endif %}>Second Video</option>
                <option value="both" {% if record.selected_video == 'both' %}selected{% endif %}>Both</option>
            </select>
        </div>

        <div class="form-group">
            <label for="model_used" class="form-label">Model Used</label>
            <select class="form-control" id="model_used" name="model_used">
                <option value="">Select a model...</option>
                <optgroup label="OpenAI">
                    <option value="gpt-4.1" {% if record.model_used == 'gpt-4.1' %}selected{% endif %}>gpt-4.1</option>
                    <option value="gpt-4o" {% if record.model_used == 'gpt-4o' %}selected{% endif %}>gpt-4o</option>
                    <option value="gpt-4o-mini" {% if record.model_used == 'gpt-4o-mini' %}selected{% endif %}>gpt-4o-mini</option>
                    <option value="o1" {% if record.model_used == 'o1' %}selected{% endif %}>o1</option>
                    <option value="o1-mini" {% if record.model_used == 'o1-mini' %}selected{% endif %}>o1-mini</option>
                    <option value="o3-mini" {% if record.model_used == 'o3-mini' %}selected{% endif %}>o3-mini</option>
                    <option value="gpt-4-turbo" {% if record.model_used == 'gpt-4-turbo' %}selected{% endif %}>gpt-4-turbo</option>
                    <option value="gpt-4" {% if record.model_used == 'gpt-4' %}selected{% endif %}>gpt-4</option>
                </optgroup>
                <optgroup label="Anthropic">
                    <option value="claude-opus-4-20250514" {% if record.model_used == 'claude-opus-4-20250514' %}selected{% endif %}>claude-opus-4-20250514</option>
                    <option value="claude-sonnet-4-20250514" {% if record.model_used == 'claude-sonnet-4-20250514' %}selected{% endif %}>claude-sonnet-4-20250514</option>
                    <option value="claude-3-7-sonnet-20250219" {% if record.model_used == 'claude-3-7-sonnet-20250219' %}selected{% endif %}>claude-3-7-sonnet-20250219</option>
                    <option value="claude-3-5-sonnet-20241022" {% if record.model_used == 'claude-3-5-sonnet-20241022' %}selected{% endif %}>claude-3-5-sonnet-20241022</option>
                    <option value="claude-3-5-sonnet-20240620" {% if record.model_used == 'claude-3-5-sonnet-20240620' %}selected{% endif %}>claude-3-5-sonnet-20240620</option>
                    <option value="claude-3-5-haiku-20241022" {% if record.model_used == 'claude-3-5-haiku-20241022' %}selected{% endif %}>claude-3-5-haiku-20241022</option>
                </optgroup>
                <optgroup label="Google">
                    <option value="gemini-2.5-pro" {% if record.model_used == 'gemini-2.5-pro' %}selected{% endif %}>gemini-2.5-pro</option>
                    <option value="gemini-2.5-flash" {% if record.model_used == 'gemini-2.5-flash' %}selected{% endif %}>gemini-2.5-flash</option>
                    <option value="gemini-2.5-flash-lite-preview-06-17" {% if record.model_used == 'gemini-2.5-flash-lite-preview-06-17' %}selected{% endif %}>gemini-2.5-flash-lite-preview-06-17</option>
                    <option value="gemini-2.0-flash" {% if record.model_used == 'gemini-2.0-flash' %}selected{% endif %}>gemini-2.0-flash</option>
                    <option value="gemini-2.0-flash-lite" {% if record.model_used == 'gemini-2.0-flash-lite' %}selected{% endif %}>gemini-2.0-flash-lite</option>
                </optgroup>
                <optgroup label="DeepSeek">
                    <option value="deepseek-r1" {% if record.model_used == 'deepseek-r1' %}selected{% endif %}>deepseek-r1</option>
                    <option value="deepseek-v3" {% if record.model_used == 'deepseek-v3' %}selected{% endif %}>deepseek-v3</option>
                </optgroup>
                <optgroup label="Meta">
                    <option value="llama-4-maverick" {% if record.model_used == 'llama-4-maverick' %}selected{% endif %}>llama-4-maverick</option>
                    <option value="llama-3.1-405b-instruct" {% if record.model_used == 'llama-3.1-405b-instruct' %}selected{% endif %}>llama-3.1-405b-instruct</option>
                    <option value="llama-3.1-70b-instruct" {% if record.model_used == 'llama-3.1-70b-instruct' %}selected{% endif %}>llama-3.1-70b-instruct</option>
                    <option value="llama-3.1-8b-instruct" {% if record.model_used == 'llama-3.1-8b-instruct' %}selected{% endif %}>llama-3.1-8b-instruct</option>
                </optgroup>
                <optgroup label="Mistral AI">
                    <option value="mistral-large-2411" {% if record.model_used == 'mistral-large-2411' %}selected{% endif %}>mistral-large-2411</option>
                    <option value="mistral-medium" {% if record.model_used == 'mistral-medium' %}selected{% endif %}>mistral-medium</option>
                    <option value="mistral-small-2412" {% if record.model_used == 'mistral-small-2412' %}selected{% endif %}>mistral-small-2412</option>
                </optgroup>
                <optgroup label="Other">
                    <option value="custom" {% if record.model_used == 'custom' %}selected{% endif %}>Custom Model</option>
                </optgroup>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="action-button action-button--primary">
                <span class="material-icons action-button__icon">save</span> Update Evaluation Case
            </button>
            <a href="{{ url_for('projects.evaluation_case_detail', record_id=record.id) }}" class="action-button action-button--secondary">
                <span class="material-icons action-button__icon">cancel</span> Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
